<!doctype html>
<html><head><meta charset="utf-8"><title>Job Fit Analyser</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}
 input,textarea{width:100%;padding:.5rem;margin:.25rem 0 1rem;box-sizing:border-box}
 button{padding:.6rem 1.2rem;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
 .tag{display:inline-block;padding:2px 10px;margin:2px;border-radius:12px;font-size:.85rem}
 .ok{background:#dcfce7}.bad{background:#fee2e2}.extra{background:#e0e7ff}
 table{width:100%;border-collapse:collapse}td,th{padding:.5rem;border-bottom:1px solid #ddd;text-align:left}
</style></head>
<body><h1><a href="/" style="text-decoration:none;color:inherit">Job Fit Analyser</a></h1>
{% block content %}{% endblock %}</body></html>
